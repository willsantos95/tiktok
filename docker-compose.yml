services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: relampago-tiktok
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "3000:3000"
    environment:
      - PORT=3000
      - APP_URL=${APP_URL:-http://localhost}
      - NODE_ENV=${NODE_ENV:-production}
      - TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET}
      - TIKTOK_REDIRECT_URI=${TIKTOK_REDIRECT_URI}
      - TIKTOK_API_BASE_URL=${TIKTOK_API_BASE_URL}
      - TIKTOK_SANDBOX=${TIKTOK_SANDBOX:-true}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - SESSION_SECRET=${SESSION_SECRET}
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
